apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
spec:
  accessMode: ReadWrite
  credential:
    name: cloud-credentials
    key: cloud
  config:
    region: seaweed
    s3ForcePathStyle: "true"
    s3Url: http://seaweedfs.velero.svc:8333
  default: true
  objectStorage:
    bucket: velero-mcp-a
  provider: aws
  validationFrequency: "5s"
---
